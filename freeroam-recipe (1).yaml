  # ================= NUI: CSS =================
  - action: write_file
    file: ./resources/[local]/freeroam/html/style.css
    data: |
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root { --acc: #ff2e63; --acc2: #08d9d6; --bg: rgba(14, 16, 24, 0.92); --line: rgba(255, 255, 255, 0.09); }
      html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: 'Segoe UI', Arial, sans-serif; color: #fff; user-select: none; }
      .hidden { display: none !important; }

      /* ---------- HUD ---------- */
      #hud > div { position: absolute; }
      #topleft { top: 1.6vh; left: 1.2vw; text-shadow: 0 1px 4px #000; }
      #street { font-size: 1.9vh; font-weight: 700; letter-spacing: 1px; }
      #zone { font-size: 1.4vh; opacity: 0.75; }
      #topright { top: 1.6vh; right: 1.2vw; display: flex; gap: 0.8vw; align-items: center; background: var(--bg); padding: 0.7vh 1vw; border-radius: 8px; border-left: 3px solid var(--acc); font-size: 1.4vh; }
      .brand { font-weight: 800; letter-spacing: 2px; color: var(--acc); }
      .hint { opacity: 0.6; }

      #drift { top: 9vh; left: 50%; transform: translateX(-50%); text-align: center; text-shadow: 0 2px 8px #000; }
      .dlabel { font-size: 1.6vh; letter-spacing: 6px; color: var(--acc2); font-weight: 700; }
      #driftscore { font-size: 6vh; font-weight: 900; line-height: 1; color: #ffd400; }
      .dbest { font-size: 1.3vh; opacity: 0.7; }

      #bars { bottom: 2.2vh; left: 50%; transform: translateX(-50%); width: 18vw; display: flex; flex-direction: column; gap: 0.6vh; }
      .bar { height: 0.9vh; background: rgba(255, 255, 255, 0.14); border-radius: 6px; overflow: hidden; }
      .bar div { height: 100%; width: 0; border-radius: 6px; transition: width 0.15s linear; }
      .hp div { background: linear-gradient(90deg, #ff2e63, #ff6b81); }
      .ar div { background: linear-gradient(90deg, #08a0d9, #08d9d6); }

      #speedo { bottom: 2.4vh; right: 1.6vw; width: 17vw; background: var(--bg); padding: 1.4vh 1.2vw; border-radius: 12px; border-bottom: 3px solid var(--acc); }
      .srow { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 0.8vh; }
      #speed { font-size: 6.4vh; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
      .sside { text-align: right; }
      .unit { font-size: 1.4vh; opacity: 0.6; letter-spacing: 2px; }
      #gear { font-size: 3.4vh; font-weight: 800; color: var(--acc2); }
      .rpm div { background: linear-gradient(90deg, #08d9d6, #ffd400, #ff2e63); }
      .nlabel { font-size: 1.2vh; letter-spacing: 2px; margin: 1vh 0 0.4vh; opacity: 0.8; }
      .key { background: rgba(255, 255, 255, 0.18); padding: 0 5px; border-radius: 4px; }
      .nitro div { background: linear-gradient(90deg, #3a7bff, #08d9d6); }
      .nitro.active { box-shadow: 0 0 12px #3a7bff; }

      #toasts { position: fixed; top: 9vh; right: 1.2vw; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
      .toast { background: var(--bg); border-left: 3px solid var(--acc2); padding: 8px 14px; border-radius: 6px; font-size: 1.5vh; animation: fadein 0.2s ease; max-width: 26vw; }
      @keyframes fadein { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }

      /* ---------- MENU ---------- */
      #menu { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.45); }
      .panel { width: 62vw; max-width: 980px; height: 78vh; background: var(--bg); border-radius: 14px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); }
      .head { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, rgba(255, 46, 99, 0.25), transparent); }
      .head h1 { font-size: 20px; letter-spacing: 4px; }
      #closebtn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; opacity: 0.7; }
      #closebtn:hover { opacity: 1; color: var(--acc); }
      .tabs { display: flex; gap: 6px; padding: 10px 14px 0; border-bottom: 1px solid var(--line); }
      .tab { padding: 10px 18px; cursor: pointer; border-radius: 8px 8px 0 0; font-size: 14px; opacity: 0.65; border-bottom: 3px solid transparent; }
      .tab:hover { opacity: 1; }
      .tab.on { opacity: 1; border-bottom-color: var(--acc); background: rgba(255, 255, 255, 0.05); }
      .content { flex: 1; overflow-y: auto; padding: 16px 20px 24px; }
      .content::-webkit-scrollbar { width: 8px; }
      .content::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }

      .sec { margin-bottom: 22px; }
      .sec h3 { font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--acc2); margin-bottom: 10px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
      .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px 16px; }
      .field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
      .field label { opacity: 0.75; }
      .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
      .btn { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid var(--line); padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 13px; }
      .btn:hover { background: var(--acc); border-color: var(--acc); }
      .btn.on { background: rgba(8, 217, 214, 0.25); border-color: var(--acc2); }
      .btn.danger:hover { background: #b00020; }
      select, input[type=text] { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid var(--line); padding: 8px 10px; border-radius: 8px; font-size: 13px; outline: none; }
      select option { background: #1a1d2b; color: #fff; }
      input[type=text] { user-select: text; }
      input[type=color] { width: 100%; height: 34px; border: 1px solid var(--line); border-radius: 8px; background: none; cursor: pointer; }
      input[type=range] { width: 100%; }
      .chk { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
      .muted, .empty { opacity: 0.6; font-size: 14px; padding: 20px 0; }
      .car { display: flex; justify-content: space-between; align-items: center; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
      .car .nm { font-weight: 600; }
      .car .sub { font-size: 12px; opacity: 0.6; }
      .car .acts { display: flex; gap: 6px; }

  # ================= NUI: JS =================
  - action: write_file
    file: ./resources/[local]/freeroam/html/script.js
    data: |
      var RES = (typeof GetParentResourceName === 'function') ? GetParentResourceName() : 'freeroam';
      var menuOpen = false;
      var tab = 'cars';
      var garage = [];
      var pedSaved = null;

      function post(name, data) {
        return fetch('https://' + RES + '/' + name, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json; charset=UTF-8' },
          body: JSON.stringify(data || {})
        }).then(function (r) { return r.json(); }).catch(function () { return {}; });
      }

      function el(id) { return document.getElementById(id); }

      function h(tag, attrs, kids) {
        var e = document.createElement(tag);
        attrs = attrs || {};
        Object.keys(attrs).forEach(function (k) {
          var v = attrs[k];
          if (k === 'class') e.className = v;
          else if (k === 'text') e.textContent = v;
          else if (k === 'value' || k === 'checked') return;
          else if (k.indexOf('on') === 0) e.addEventListener(k.slice(2), v);
          else e.setAttribute(k, v);
        });
        (kids || []).forEach(function (c) {
          if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
        });
        if ('value' in attrs) e.value = attrs.value;
        if ('checked' in attrs) e.checked = !!attrs.checked;
        return e;
      }

      function btn(label, fn, cls) { return h('button', { 'class': 'btn ' + (cls || ''), text: label, onclick: fn }); }
      function section(title, nodes) { return h('div', { 'class': 'sec' }, [h('h3', { text: title })].concat(nodes)); }
      function field(label, control) { return h('div', { 'class': 'field' }, [h('label', { text: label }), control]); }

      function sel(opts, cur, fn) {
        var s = h('select', {}, opts.map(function (o) { return h('option', { value: String(o[0]), text: o[1] }); }));
        s.value = String(cur);
        s.addEventListener('change', function () { fn(parseInt(s.value, 10)); });
        return s;
      }

      function check(label, on, fn) {
        var i = h('input', { type: 'checkbox', checked: on });
        i.addEventListener('change', function () { fn(i.checked); });
        return h('label', { 'class': 'chk' }, [i, label]);
      }

      function range(min, max, cur, fn) {
        var r = h('input', { type: 'range', min: min, max: max, value: cur });
        r.addEventListener('change', function () { fn(parseInt(r.value, 10)); });
        return r;
      }

      function hexToRgb(hex) {
        var n = parseInt(hex.slice(1), 16);
        return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
      }
      function rgbToHex(a) {
        a = a || [136, 136, 136];
        return '#' + a.map(function (v) { return ('0' + Math.round(v).toString(16)).slice(-2); }).join('');
      }
      function colorPick(arr, send) {
        var inp = h('input', { type: 'color', value: rgbToHex(arr) });
        var last = 0;
        inp.addEventListener('input', function () {
          var n = Date.now();
          if (n - last > 90) { last = n; send(hexToRgb(inp.value)); }
        });
        inp.addEventListener('change', function () { send(hexToRgb(inp.value)); });
        return inp;
      }

      function tune(obj) { return post('tune', obj); }
      function act(type) { tune({ type: type }).then(renderTuning); }

      /* ---------------- DATA ---------------- */
      var VEHICLES = [
        { name: 'Drift / JDM', list: [['sultan', 'Sultan'], ['sultanrs', 'Sultan RS'], ['elegy2', 'Elegy RH8'], ['futo', 'Futo'], ['jester', 'Jester'], ['jester3', 'Jester Classic'], ['kuruma', 'Kuruma'], ['calico', 'Calico GTF'], ['zr350', 'ZR350'], ['remus', 'Remus'], ['previon', 'Previon'], ['rt3000', 'RT3000'], ['vectre', 'Vectre'], ['growler', 'Growler'], ['cypher', 'Cypher'], ['comet6', 'Comet S2']] },
        { name: 'Muscle', list: [['dominator', 'Dominator'], ['dominator3', 'Dominator GTX'], ['gauntlet', 'Gauntlet'], ['gauntlet3', 'Gauntlet Classic'], ['buffalo3', 'Buffalo Sprunk'], ['sabregt', 'Sabre Turbo'], ['tampa', 'Tampa'], ['hotknife', 'Hotknife'], ['dukes', 'Dukes'], ['ruiner', 'Ruiner'], ['vigero', 'Vigero']] },
        { name: 'Szuper', list: [['zentorno', 'Zentorno'], ['adder', 'Adder'], ['t20', 'T20'], ['osiris', 'Osiris'], ['turismor', 'Turismo R'], ['entityxf', 'Entity XF'], ['vacca', 'Vacca'], ['infernus', 'Infernus'], ['banshee2', 'Banshee 900R'], ['nero', 'Nero'], ['emerus', 'Emerus'], ['krieger', 'Krieger'], ['thrax', 'Thrax'], ['deveste', 'Deveste Eight'], ['tyrant', 'Tyrant']] },
        { name: 'Sport', list: [['comet2', 'Comet'], ['carbonizzare', 'Carbonizzare'], ['feltzer2', 'Feltzer'], ['massacro', 'Massacro'], ['ninef', '9F'], ['rapidgt', 'Rapid GT'], ['surano', 'Surano'], ['schwartzer', 'Schwartzer'], ['coquette', 'Coquette'], ['lynx', 'Lynx']] },
        { name: 'Motorok', list: [['bati', 'Bati 801'], ['hakuchou', 'Hakuchou'], ['akuma', 'Akuma'], ['sanchez', 'Sanchez'], ['shotaro', 'Shotaro'], ['double', 'Double-T'], ['ruffian', 'Ruffian'], ['nemesis', 'Nemesis'], ['bf400', 'BF400'], ['manchez', 'Manchez']] },
        { name: 'Terep', list: [['bifta', 'Bifta'], ['dune', 'Dune Buggy'], ['bfinjection', 'BF Injection'], ['sandking', 'Sandking'], ['kamacho', 'Kamacho'], ['trophytruck', 'Trophy Truck'], ['blazer', 'Blazer'], ['monster', 'Monster Truck'], ['marshall', 'Marshall']] },
        { name: 'Fun / Különleges', list: [['rhino', 'Tank'], ['deluxo', 'Deluxo'], ['oppressor2', 'Oppressor MK2'], ['rcbandito', 'RC Bandito'], ['ratloader', 'Rat Loader'], ['bmx', 'BMX'], ['faggio', 'Faggio'], ['caddy', 'Caddy'], ['veto', 'Veto'], ['stunt', 'Stunt Plane'], ['frogger', 'Frogger'], ['hydra', 'Hydra'], ['lazer', 'Lazer'], ['dodo', 'Dodo']] }
      ];

      var PEDS = [
        ['a_m_y_skater_01', 'Gördeszkás'], ['a_m_y_hipster_01', 'Hipster'], ['a_m_y_beach_01', 'Strandoló'], ['a_m_y_musclbeac_01', 'Izmos'],
        ['a_f_y_beach_01', 'Strandoló (nő)'], ['a_f_y_hipster_01', 'Hipster (nő)'], ['a_f_y_tourist_01', 'Turista (nő)'], ['a_m_m_business_01', 'Üzletember'],
        ['s_m_y_cop_01', 'Rendőr'], ['s_m_y_swat_01', 'SWAT'], ['s_m_y_marine_01', 'Tengerészgyalogos'], ['s_m_m_pilot_01', 'Pilóta'],
        ['s_m_m_movspace_01', 'Űrhajós'], ['s_m_y_clown_01', 'Bohóc'], ['player_zero', 'Michael'], ['player_one', 'Franklin'],
        ['player_two', 'Trevor'], ['u_m_m_jesus_01', 'Jézus'], ['u_m_y_juggernaut_01', 'Juggernaut'], ['u_m_y_zombie_01', 'Zombi'],
        ['s_m_m_movalien_01', 'Űrlény'], ['u_m_y_pogo_01', 'Pogo'], ['mp_m_freemode_01', 'Freemode (férfi)'], ['mp_f_freemode_01', 'Freemode (nő)']
      ];

      var GROUPS = [['perf', 'Teljesítmény'], ['body', 'Karosszéria'], ['wheels', 'Kerekek'], ['other', 'Egyéb']];
      var WHEEL_TYPES = [[0, 'Sport'], [1, 'Muscle'], [2, 'Lowrider'], [3, 'SUV'], [4, 'Terep'], [5, 'Tuner'], [6, 'Motor'], [7, 'High End'], [8, "Benny's Original"], [9, "Benny's Bespoke"]];
      var TINTS = [[0, 'Nincs'], [1, 'Pure Black'], [2, 'Dark Smoke'], [3, 'Light Smoke'], [4, 'Stock'], [5, 'Limo'], [6, 'Green']];
      var PLATES = [[0, 'Kék/Fehér 1'], [1, 'Sárga/Fekete'], [2, 'Sárga/Kék'], [3, 'Kék/Fehér 2'], [4, 'Kék/Fehér 3'], [5, 'Yankton']];
      var XENON = [[0, 'Fehér'], [1, 'Kék'], [2, 'Elektromos kék'], [3, 'Menta'], [4, 'Lime'], [5, 'Sárga'], [6, 'Arany'], [7, 'Narancs'], [8, 'Piros'], [9, 'Rózsaszín (pony)'], [10, 'Pink'], [11, 'Lila'], [12, 'Fekete fény']];

      /* ---------------- TABS ---------------- */
      var TABS = [['cars', 'Járművek'], ['tune', 'Tuning'], ['garage', 'Garázs'], ['ped', 'Karakter']];

      function renderTabs() {
        var t = el('tabs');
        t.innerHTML = '';
        TABS.forEach(function (x) {
          t.appendChild(h('div', { 'class': 'tab' + (tab === x[0] ? ' on' : ''), text: x[1], onclick: function () { tab = x[0]; render(); } }));
        });
      }

      function render() {
        renderTabs();
        if (tab === 'cars') renderCars();
        else if (tab === 'tune') renderTuning();
        else if (tab === 'garage') renderGarage();
        else renderPed();
      }

      function renderCars() {
        var box = el('content');
        box.innerHTML = '';
        var inp = h('input', { type: 'text', placeholder: 'Bármely modell neve (pl. zentorno)' });
        var go = function () { if (inp.value.trim()) post('spawn', { model: inp.value.trim() }); };
        inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
        box.appendChild(h('div', { 'class': 'row' }, [inp, btn('Spawn', go)]));
        VEHICLES.forEach(function (cat) {
          var grid = h('div', { 'class': 'grid' }, cat.list.map(function (v) {
            return btn(v[1], function () { post('spawn', { model: v[0] }); });
          }));
          box.appendChild(section(cat.name, [grid]));
        });
      }

      function renderTuning() {
        var box = el('content');
        box.innerHTML = '';
        box.appendChild(h('div', { 'class': 'muted', text: 'Betöltés...' }));
        post('getTuning').then(function (d) {
          box.innerHTML = '';
          if (!d || !d.ok) {
            box.appendChild(h('div', { 'class': 'empty', text: 'Ülj be egy járműbe a tuninghoz!' }));
            return;
          }
          var s = d.state;
          box.appendChild(h('div', { 'class': 'row' }, [
            btn('Max teljesítmény', function () { act('maxPerf'); }),
            btn('Max tuning', function () { act('maxAll'); }),
            btn('Alaphelyzet', function () { act('reset'); }),
            btn('Javítás', function () { act('repair'); })
          ]));

          GROUPS.forEach(function (g) {
            var nodes = [];
            d.mods.filter(function (m) { return m.group === g[0]; }).forEach(function (m) {
              var opts = [[-1, 'Alap']].concat(m.options.map(function (o, i) { return [i, o]; }));
              nodes.push(field(m.name, sel(opts, m.cur, function (v) { tune({ type: 'mod', id: m.id, value: v }); })));
            });
            if (g[0] === 'perf') {
              nodes.push(h('div', { 'class': 'field' }, [check('Turbó', s.turbo, function (v) { tune({ type: 'toggle', id: 18, value: v }); })]));
            }
            if (g[0] === 'wheels') {
              nodes.unshift(field('Felni típus', sel(WHEEL_TYPES, s.wheelType, function (v) {
                tune({ type: 'wheelType', value: v }).then(renderTuning);
              })));
              nodes.push(h('div', { 'class': 'field' }, [check('Gumifüst', s.smoke, function (v) { tune({ type: 'toggle', id: 20, value: v }); })]));
              nodes.push(field('Gumifüst színe', colorPick(s.smokeColor, function (c) { tune({ type: 'smokeColor', r: c.r, g: c.g, b: c.b }); })));
            }
            if (nodes.length) box.appendChild(section(g[1], [h('div', { 'class': 'fields' }, nodes)]));
          });

          box.appendChild(section('Színek', [h('div', { 'class': 'fields' }, [
            field('Elsődleges szín', colorPick(s.primary, function (c) { tune({ type: 'primary', r: c.r, g: c.g, b: c.b }); })),
            field('Másodlagos szín', colorPick(s.secondary, function (c) { tune({ type: 'secondary', r: c.r, g: c.g, b: c.b }); })),
            field('Gyöngyház (0-159)', range(0, 159, s.pearl || 0, function (v) { tune({ type: 'pearl', value: v }); })),
            field('Felni szín (0-159)', range(0, 159, s.wheelColor || 0, function (v) { tune({ type: 'wheelColor', value: v }); }))
          ])]));

          var neonNames = ['Bal', 'Jobb', 'Elöl', 'Hátul'];
          var neonChecks = neonNames.map(function (n, i) {
            return check('Neon: ' + n, s.neon[i], function (v) { tune({ type: 'neon', index: i, value: v }); });
          });
          var plate = h('input', { type: 'text', maxlength: '8', value: s.plate || '' });
          box.appendChild(section('Fények, ablak, rendszám', [h('div', { 'class': 'fields' }, neonChecks.concat([
            field('Neon szín', colorPick(s.neonColor, function (c) { tune({ type: 'neonColor', r: c.r, g: c.g, b: c.b }); })),
            h('div', { 'class': 'field' }, [check('Xenon', s.xenon, function (v) { tune({ type: 'toggle', id: 22, value: v }); })]),
            field('Xenon szín', sel(XENON, s.xenonColor, function (v) { tune({ type: 'xenonColor', value: v }); })),
            field('Ablak sötétítés', sel(TINTS, s.tint, function (v) { tune({ type: 'tint', value: v }); })),
            field('Rendszám stílus', sel(PLATES, s.plateIndex, function (v) { tune({ type: 'plateIndex', value: v }); })),
            field('Rendszám szöveg', h('div', { 'class': 'row' }, [plate, btn('OK', function () { tune({ type: 'plateText', value: plate.value }); })]))
          ]))]));
        });
      }

      function renderGarage() {
        var box = el('content');
        box.innerHTML = '';
        var name = h('input', { type: 'text', maxlength: '30', placeholder: 'Név (opcionális)' });
        box.appendChild(section('Jelenlegi autó mentése', [h('div', { 'class': 'row' }, [
          name,
          btn('Mentés a garázsba', function () { post('saveCar', { name: name.value }); })
        ])]));
        var list = [];
        if (!garage.length) list.push(h('div', { 'class': 'empty', text: 'A garázsod üres. Ülj be egy autóba, tuningold meg, és mentsd el!' }));
        garage.forEach(function (c) {
          list.push(h('div', { 'class': 'car' }, [
            h('div', {}, [h('div', { 'class': 'nm', text: c.name }), h('div', { 'class': 'sub', text: c.label })]),
            h('div', { 'class': 'acts' }, [
              btn('Spawn', function () { post('loadCar', { id: c.id }); }),
              btn('Törlés', function () { post('deleteCar', { id: c.id }); }, 'danger')
            ])
          ]));
        });
        box.appendChild(section('Garázs (' + garage.length + '/25)', list));
      }

      function renderPed() {
        var box = el('content');
        box.innerHTML = '';
        var inp = h('input', { type: 'text', placeholder: 'Bármely ped modell (pl. s_m_y_cop_01)' });
        var go = function () { if (inp.value.trim()) post('setPed', { model: inp.value.trim() }); };
        inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
        box.appendChild(h('div', { 'class': 'row' }, [inp, btn('Alkalmaz', go), btn('Alap karakter', function () { post('resetPed'); }, 'danger')]));
        var grid = h('div', { 'class': 'grid' }, PEDS.map(function (p) {
          return btn(p[1], function () { post('setPed', { model: p[0] }); }, pedSaved === p[0] ? 'on' : '');
        }));
        box.appendChild(section('Karakterek (a választás mentődik)', [grid]));
      }

      /* ---------------- HUD ---------------- */
      function setHud(d) {
        el('street').textContent = d.street || '';
        el('zone').textContent = d.zone || '';
        el('pid').textContent = 'ID ' + d.id;
        el('clock').textContent = d.clock;
        el('hpfill').style.width = d.hp + '%';
        el('arfill').style.width = d.armor + '%';
        var sp = el('speedo');
        if (d.inVeh) {
          sp.classList.remove('hidden');
          el('speed').textContent = d.speed;
          el('gear').textContent = d.gear === 0 ? 'N' : d.gear;
          el('rpmfill').style.width = Math.round((d.rpm || 0) * 100) + '%';
          el('nitrofill').style.width = d.nitro + '%';
          document.querySelector('.bar.nitro').classList.toggle('active', !!d.nitroActive);
        } else {
          sp.classList.add('hidden');
        }
        var dr = el('drift');
        if (d.drift > 0) {
          dr.classList.remove('hidden');
          el('driftscore').textContent = d.drift;
          el('driftbest').textContent = d.best;
        } else {
          dr.classList.add('hidden');
        }
      }

      function toast(text) {
        var t = h('div', { 'class': 'toast', text: text });
        el('toasts').appendChild(t);
        setTimeout(function () { t.remove(); }, 3800);
      }

      /* ---------------- MENU OPEN/CLOSE ---------------- */
      function showMenu(startTab) {
        menuOpen = true;
        if (startTab) tab = startTab;
        el('menu').classList.remove('hidden');
        render();
      }
      function hideMenu() {
        menuOpen = false;
        el('menu').classList.add('hidden');
      }

      el('closebtn').addEventListener('click', function () { hideMenu(); post('close'); });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && menuOpen) { hideMenu(); post('close'); }
      });

      window.addEventListener('message', function (ev) {
        var d = ev.data || {};
        if (d.action === 'hud') setHud(d);
        else if (d.action === 'open') showMenu(d.tab);
        else if (d.action === 'close') hideMenu();
        else if (d.action === 'toast') toast(d.text);
        else if (d.action === 'data') {
          garage = d.garage || [];
          pedSaved = d.ped || null;
          if (menuOpen && (tab === 'garage' || tab === 'ped')) render();
        }
      });

  # 3) server.cfg
  - action: write_file
    file: ./server.cfg
    data: |
      # ===== Freeroam Drift & Fun =====
      {{serverEndpoints}}

      sv_maxclients {{maxClients}}
      set steam_webApiKey ""
      sv_licenseKey "{{svLicense}}"
      set onesync on

      sv_hostname "{{serverName}} | {{recipeName}}"
      sets sv_projectName "{{serverName}}"
      sets sv_projectDesc "{{recipeDescription}}"
      sets tags "freeroam, drift, cars, fun, racing, hungarian"
      sets locale "hu-HU"
      load_server_icon icon.png

      sv_scriptHookAllowed 0

      # Alap resource-ok
      ensure mapmanager
      ensure chat
      ensure spawnmanager
      ensure sessionmanager
      ensure hardcap
      ensure rconlog
      ensure baseevents

      # Sajat freeroam resource (HUD, menu, garazs, ped, tuning, drift, nitro)
      ensure freeroam

      # Admin jogok (txAdmin kezeli az adminokat, ez csak a konzol-parancsokhoz kell)
      add_ace group.admin command allow
      add_ace group.admin command.quit deny
      add_principal group.admin group.moderator
